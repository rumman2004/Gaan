name: Android Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the built APKs'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v5.2.84). Required if create_release is true.'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-gms-universal-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-gms-universal-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create Debug Keystore
        run: |
          # Generate debug keystore at all possible default paths AGP may resolve to
          for DIR in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$DIR"
            if [ ! -f "$DIR/debug.keystore" ]; then
              keytool -genkeypair \
                -keystore "$DIR/debug.keystore" \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      - name: Create google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf "%s" "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

      - name: Set up Signing Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore

      - name: Determine build type
        id: build_type
        run: |
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"
          IS_MANUAL_RELEASE="${{ github.event.inputs.create_release == 'true' }}"
          if [ "$IS_TAG" = "true" ] || [ "$IS_MANUAL_RELEASE" = "true" ]; then
            echo "build_variant=Release" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_variant=Release" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Universal APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: ./gradlew assembleUniversalGms${{ steps.build_type.outputs.build_variant }}

      - name: Build per-architecture APKs (Release only)
        if: steps.build_type.outputs.is_release == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: |
          ./gradlew assembleArm64GmsRelease
          ./gradlew assembleArmeabiGmsRelease
          ./gradlew assembleX86_64GmsRelease

      - name: Rename and Organize APKs
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          echo "App Version: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          mkdir -p app/build/outputs/apk/release-artifacts

          # Universal APK — named Gaan.apk
          find app/build/outputs/apk/universalGms* -name "*.apk" | while read -r apk_path; do
              cp "$apk_path" "app/build/outputs/apk/release-artifacts/Gaan.apk"
              echo "Copied $apk_path -> release-artifacts/Gaan.apk"
          done

          # Per-architecture APKs (only present for release builds)
          for arch_dir in arm64Gms armeabiGms x86_64Gms; do
              find "app/build/outputs/apk/${arch_dir}Release/" -name "*.apk" 2>/dev/null | while read -r apk_path; do
                  arch_name=$(echo "$arch_dir" | sed 's/Gms$//')
                  target_name="Gaan-${arch_name}.apk"
                  cp "$apk_path" "app/build/outputs/apk/release-artifacts/$target_name"
                  echo "Copied $apk_path -> release-artifacts/$target_name"
              done
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gaan-Universal
          path: app/build/outputs/apk/release-artifacts/*.apk

      - name: Parse Release Info
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          TITLE=$(head -n 1 RELEASE_INFO.md | sed 's/^# //')
          echo "RELEASE_TITLE=$TITLE" >> "$GITHUB_ENV"
          tail -n +3 RELEASE_INFO.md > release-body.md

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_nightly=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.create_release }}" == "true" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v$VERSION_NAME"
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_nightly=false" >> "$GITHUB_OUTPUT"
            # Create the tag if it doesn't exist
            git tag "$TAG" || true
            git push origin "$TAG" || true
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_nightly=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.is_nightly == 'true' && 'Nightly Build' || env.RELEASE_TITLE }}
          body_path: release-body.md
          prerelease: false
          files: app/build/outputs/apk/release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TITLE: ${{ env.RELEASE_TITLE }}
        run: |
          BODY=$(cat release-body.md)
          SAFE_BODY=$(echo "$BODY" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          if [ ${#SAFE_BODY} -gt 3000 ]; then
            SAFE_BODY="${SAFE_BODY:0:3000}..."$'\n\n'"[Changelog truncated due to length. See GitHub Release for full details.]"
          fi

          printf -v MESSAGE "🆕 <b>New Release: %s</b>\n\n📋 <b>Changelog:</b>\n<blockquote>%s</blockquote>\n\n⚠️ <b>Note:</b>\n<i>If you encounter an 'App not installed' error during installation, please uninstall the previous version before installing this update.</i>" "${RELEASE_TITLE}" "${SAFE_BODY}"

          if ! echo "$BODY" | grep -q "Support the Project"; then
            printf -v MESSAGE "%s\n\n🤝 <b>Support Gaan</b>\nIf you'd like to support ongoing development, you can do so here:\n☕ <a href=\"https://buymeacoffee.com/iad1tya\">Buy Me a Coffee</a>\n⭐ <a href=\"https://github.com/sponsors/iad1tya\">GitHub Sponsors</a>\n🌐 <a href=\"https://support.iad1tya.cyou/\">Support Page</a>\n\n<i>Thank you for your continued support.</i>" "$MESSAGE"
          fi

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            --arg parse_mode "HTML" \
            '{
              chat_id: $chat_id,
              text: $text,
              parse_mode: $parse_mode,
              disable_web_page_preview: true
            }' > telegram-payload.json

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d @telegram-payload.json

      - name: Send Discord Release Notification
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK || secrets.DISCORD_WEBHOOK }}
          RELEASE_TITLE: ${{ env.RELEASE_TITLE }}
        run: |
          BODY=$(cat release-body.md)
          PING_TEXT="@everyone New Release Available - **$RELEASE_TITLE**"

          jq -n \
            --arg ping "$PING_TEXT" \
            --arg desc "$BODY" \
            '{
              content: $ping,
              embeds: [{
                title: "Release Changelog",
                description: $desc,
                color: 16738660,
                footer: { text: "Gaan Automation System" }
              }]
            }' > discord-release-payload.json

          if [ -n "$DISCORD_RELEASE_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" -d @discord-release-payload.json "$DISCORD_RELEASE_WEBHOOK"
          else
            echo "DISCORD_RELEASE_WEBHOOK is not set, skipping notification."
          fi

      - name: Send Discord Notification
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/') && github.event.inputs.create_release != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TITLE: ${{ env.RELEASE_TITLE }}
        run: |
          BODY=$(cat release-body.md)
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          TARGET_TITLE="New Beta Build - v$VERSION_NAME"
          DOWNLOAD_LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LINK_LABEL="Click here to download APK ZIP from GitHub Actions Run Page"
          PING_TEXT="<@&1498758915536584714> New Build Available"
          WARNING_TEXT="Note: If you're getting an update notification, there's no need to update since you're already using the latest version. Simply disable Automatic Update Check and Update Notifications in the update settings."

          jq -n \
            --arg ping "$PING_TEXT" \
            --arg warn "$WARNING_TEXT" \
            --arg title "$TARGET_TITLE" \
            --arg desc "$BODY" \
            --arg link "$DOWNLOAD_LINK" \
            --arg label "$LINK_LABEL" \
            '{
              content: $ping,
              embeds: [{
                title: $title,
                description: ($desc + "\n\n" + $warn),
                color: 7303122,
                fields: [
                  { name: "Download APK", value: ("[" + $label + "](" + $link + ")"), inline: false }
                ],
                footer: { text: "Gaan Automation System" }
              }]
            }' > discord-payload.json

          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" -d @discord-payload.json "$DISCORD_WEBHOOK"
          else
            echo "DISCORD_WEBHOOK is not set, skipping notification."
          fi
